name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: gofmt
        run: make fmtcheck

      - name: gitignore does not exclude source
        run: make checkignore

      - name: go vet
        run: make vet

      - name: unit tests (race detector)
        run: make race

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      # Real multi-process tests: builds cmd/dkvd from source and launches actual
      # OS processes over localhost TCP, including the Phase 9 Raft election and
      # SIGKILL / HardState recovery tests. No prebuilt binaries.
      - name: integration tests (real processes, race detector)
        run: make integration
