name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs read the repository and nothing else.
permissions:
  contents: read

# An explicit bash runs every step with -eo pipefail, so a failing command
# piped to tee still fails its step (the implicit default has no pipefail).
defaults:
  run:
    shell: bash

# A newer push to the same branch or pull request supersedes a run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on a pinned runner image with the toolchain go.mod names, not
# a moving image and the latest patch release, which shift under the
# timing-sensitive tests and the pinned trace hash. The repository has no
# dependencies and no go.sum, so the module and build caches are keyed on
# go.mod. A failing job uploads its evidence: its test log, the histories and
# node logs written under $QUORUM_ARTIFACTS, and new fuzz crashers.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: gofmt
        run: make fmtcheck

      - name: gitignore does not exclude source
        run: make checkignore

      - name: go vet
        run: make vet

      - name: unit tests (race detector)
        run: make race 2>&1 | tee unit.log

      # Correctness checks only (SA*): the style checks would churn code that
      # is not wrong. Pinned versions, run with the module's toolchain.
      - name: staticcheck (correctness checks)
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -checks 'SA*' ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-evidence
          path: unit.log
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # Real multi-process tests: builds cmd/dkvd from source and launches actual
      # OS processes over localhost TCP, including the Phase 9 Raft election and
      # SIGKILL / HardState recovery tests, the Phase 10 real-process fault tests
      # (SIGKILL, SIGSTOP, TCP-proxy partitions), the Phase 11 crash-point
      # tests (dkvd -crash-at: a real SIGKILL at an exact point), the Phase 12
      # linearizability tests and the Phase 13 session tests (retries at every
      # crash window, forwarding, concurrent duplicates, a full-cluster restart;
      # durable logs replayed against the session model) and the Phase 14
      # snapshot tests (a leader's snapshot, a follower's install, SIGKILL after
      # publication and mid-install, full-cluster restart from snapshots, a retry
      # after compaction answered as a duplicate) and the Phase 15 membership and
      # multi-Raft tests in -cluster mode (a node added, the leader removed, a
      # crashed node replaced, a joint configuration through a leader SIGKILL,
      # two groups on the same processes with one broken, workloads across
      # changes checked for linearizability). No prebuilt binaries.
      # The dkvd processes are race-built too (tests/integration/launch_test.go).
      - name: integration tests (real processes, race detector)
        env:
          QUORUM_ARTIFACTS: ${{ github.workspace }}/artifacts
        run: make integration 2>&1 | tee integration.log

      - name: upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            integration.log
            artifacts/
          if-no-files-found: ignore

  faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # Phase 10: every chaos profile over 200 seeds each (including Phase 11's
      # crashpoints profile), in the deterministic simulator, plus the
      # reproducibility checks — including the pinned trace hash, which must match
      # the one recorded on another OS/architecture — the Phase 11 crash
      # matrix, the Phase 12 client workloads (every history checked for
      # linearizability) and the Phase 13 session workloads (retries and
      # duplicates checked as logical operations; every replica's apply-time
      # decision checked against the session model) and the Phase 14 snapshot
      # profiles and snapshot crash matrix (INV-SN1..SN3 checked throughout), and
      # Phase 15: the membership profiles, the membership crash matrix, the
      # multi-group schedules with their replay and isolation checks, and the
      # bounded membership model (INV-MB1..MB10 checked throughout). Any
      # failure prints its seed, the exact reproduction command, and a minimized
      # script (or the exact crashat event).
      - name: deterministic fault schedules (200 seeds per profile) and the crash matrix
        run: make faults FAULT_SEEDS=200 2>&1 | tee faults.log

      - name: upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: faults-evidence
          path: faults.log
          if-no-files-found: ignore

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # Every rule-violating edit (Phase 9 protocol rules, Phase 10 failure
      # handling and fault-model fidelity, Phase 11 crash-recovery rules, Phase 12
      # ReadIndex / completion / client / checker rules, Phase 13 deduplication /
      # forwarding / session-client / logical-checker rules, Phase 14 snapshot and
      # compaction rules, Phase 15 membership and multi-Raft rules) must be caught
      # by the tests named for it; a surviving
      # mutant — or one that does not compile — fails the build.
      - name: mutation testing
        run: make mutation 2>&1 | tee mutation.log

      - name: upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-evidence
          path: mutation.log
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # A short pass over every fuzz target in the repository (discovered, not
      # listed), including the fault-schedule fuzzer.
      - name: fuzz every target (5s each)
        run: make fuzz FUZZTIME=5s 2>&1 | tee fuzz.log

      - name: upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-evidence
          path: |
            fuzz.log
            **/testdata/fuzz/**
          if-no-files-found: ignore
